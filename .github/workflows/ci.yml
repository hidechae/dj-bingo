name: CI

# PR でのみ実行する。main へは PR 経由でしか入らないため、マージ直後に
# 同じコードをもう一度検証する push トリガーは重複でしかなかった。
on:
  pull_request:
    branches:
      - main

# Cancel superseded runs when a PR branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A single job on purpose: each check finishes in well under a minute, so
  # splitting them made us pay for five checkouts + five `npm ci` runs, and
  # Actions bills every job rounded up to a whole minute.
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    env:
      # Dummy values for build-time environment variables
      DATABASE_URL: postgresql://user:password@localhost:5432/db
      DIRECT_DATABASE_URL: postgresql://user:password@localhost:5432/db
      NEXTAUTH_SECRET: dummy-secret-for-ci-build-only
      NEXTAUTH_URL: http://localhost:3000
      GOOGLE_CLIENT_ID: dummy-client-id
      GOOGLE_CLIENT_SECRET: dummy-client-secret
      SKIP_ENV_VALIDATION: true

    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          generate-prisma: "true"

      # The checks run even after an earlier one fails, so a single run still
      # reports every problem. The build is left on the default `success()`
      # so we don't build on top of a failing check.
      - name: Check code formatting
        if: ${{ !cancelled() }}
        run: npm run format:check

      - name: Run ESLint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Run TypeScript type check
        if: ${{ !cancelled() }}
        run: npm run type-check

      - name: Run tests
        if: ${{ !cancelled() }}
        run: npm run test:run

      - name: Build application
        run: npm run build
